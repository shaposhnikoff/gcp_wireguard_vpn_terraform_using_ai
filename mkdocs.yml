site_name: WireGuard VPN Gateway on Google Cloud
site_description: Terraform-based WireGuard VPN gateway for Google Cloud.
site_url: https://shaposhnikoff.github.io/gcp_wireguard_vpn_terraform_using_ai/
repo_url: https://github.com/shaposhnikoff/gcp_wireguard_vpn_terraform_using_ai
repo_name: shaposhnikoff/gcp_wireguard_vpn_terraform_using_ai
edit_uri: edit/main/docs/
copyright: Maintained by the platform team

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Deployment: deployment.md
  - Security: security.md
  - CI and verification: ci-and-verification.md
  - Versioning and releases: versioning-and-releases.md
  - Troubleshooting: troubleshooting.md

exclude_docs: |
  agentic-workflow.md
  diagrams/

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

extra_javascript:
  - https://unpkg.com/mermaid@11.12.0/dist/mermaid.min.js
