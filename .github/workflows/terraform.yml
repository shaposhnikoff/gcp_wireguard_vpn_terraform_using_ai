name: Terraform

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: terraform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: true

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.6"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

  version:
    name: Version and changelog
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch main
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Check version bump against main
        if: github.event_name == 'pull_request'
        run: ./scripts/check-version.sh --against-base

      - name: Check changelog entry
        if: github.event_name != 'pull_request'
        run: ./scripts/check-version.sh

  plan:
    name: Terraform plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.6"
          terraform_wrapper: false

      - name: Init providers without backend
        run: terraform init -backend=false -input=false

      - name: Create offline plan
        env:
          # Dummy static token: the provider must configure, but no API call
          # is expected because refresh is disabled and state is empty.
          GOOGLE_OAUTH_ACCESS_TOKEN: ci-offline-plan-token
        shell: bash
        run: |
          set -euo pipefail
          terraform plan \
            -refresh=false \
            -lock=false \
            -input=false \
            -var-file=envs/ci/terraform.tfvars.json \
            -out=tfplan \
            -no-color | tee plan.log
          terraform show -no-color tfplan > plan.txt

      - name: Publish plan to pull request
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const { spawnSync } = require('child_process');

            const marker = '<!-- terraform-offline-plan -->';
            const planStart = '<!-- plan-start -->';
            const planEnd = '<!-- plan-end -->';
            const plan = fs.readFileSync('plan.txt', 'utf8');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );

            let diffSection = 'First plan for this pull request. A diff appears on the next run.';

            if (existing) {
              const pattern = new RegExp(
                `${planStart}\\s*\`\`\`\`hcl\\n([\\s\\S]*?)\\n\`\`\`\`\\s*${planEnd}`,
              );
              const match = existing.body.match(pattern);

              if (match && !match[1].includes('... truncated ...')) {
                const previous = match[1].endsWith('\n') ? match[1] : `${match[1]}\n`;
                fs.writeFileSync('previous-plan.txt', previous);

                const result = spawnSync(
                  'diff',
                  ['-u', '--label', 'previous', '--label', 'current', 'previous-plan.txt', 'plan.txt'],
                  { encoding: 'utf8' },
                );
                const diff = result.stdout || '';
                const added = diff
                  .split('\n')
                  .filter((line) => line.startsWith('+') && !line.startsWith('+++')).length;
                const removed = diff
                  .split('\n')
                  .filter((line) => line.startsWith('-') && !line.startsWith('---')).length;

                fs.writeFileSync('plan.diff', diff);
                fs.writeFileSync('plan-diff-stat.txt', `${added} added, ${removed} removed\n`);

                if (diff.trim() === '') {
                  diffSection = 'No infrastructure changes since the previous plan.';
                } else {
                  const maxDiff = 15000;
                  const shown =
                    diff.length > maxDiff
                      ? `${diff.slice(0, maxDiff)}\n... diff truncated ...`
                      : diff;
                  diffSection = ['```diff', shown, '```'].join('\n');
                }
              } else {
                diffSection =
                  'Previous plan could not be compared: it is missing markers or was truncated.';
              }
            }

            const planLimit = 40000;
            const planShown =
              plan.length > planLimit
                ? `${plan.slice(0, planLimit)}\n\n... truncated ...`
                : plan;

            const body = [
              marker,
              '## Terraform offline plan',
              '',
              '> Generated without a backend and without GCP credentials. Refresh is disabled: this validates the resource graph and the diff against empty state, not drift.',
              '',
              '### Changes since previous plan',
              '',
              diffSection,
              '',
              '<details><summary>Full plan</summary>',
              '',
              planStart,
              '````hcl',
              planShown,
              '````',
              planEnd,
              '',
              '</details>',
              '',
              `[Download plan artifacts](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Upload plan artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: terraform-plan
          path: |
            plan.txt
            plan.log
            tfplan
            plan.diff
            plan-diff-stat.txt
          retention-days: 5
          if-no-files-found: ignore

  validate-and-test:
    name: Validate and test (Terraform ${{ matrix.terraform }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        terraform:
          - "1.9.8"
          - "1.15.6"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

      - name: Init providers without backend
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

      - name: Run Terraform tests
        shell: bash
        run: |
          set -o pipefail
          terraform test -no-color 2>&1 | tee "tf-test-${{ matrix.terraform }}.log"

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: terraform-test-${{ matrix.terraform }}
          path: tf-test-${{ matrix.terraform }}.log
          retention-days: 3
          if-no-files-found: ignore

  tflint:
    name: TFLint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6.3.2
        with:
          tflint_version: v0.55.0
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Init TFLint plugins
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run TFLint
        run: tflint --recursive --format compact

  security:
    name: Security scan (Checkov)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          config_file: .checkov.yaml
          output_format: cli

  report:
    name: Verification report
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    needs:
      - fmt
      - version
      - plan
      - validate-and-test
      - tflint
      - security

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download test logs
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: terraform-test-*
          path: artifacts
          merge-multiple: true

      - name: Download plan
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: terraform-plan
          path: plan-artifacts

      - name: Render summary
        shell: bash
        env:
          FMT_RESULT: ${{ needs.fmt.result }}
          VERSION_RESULT: ${{ needs.version.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          TEST_RESULT: ${{ needs.validate-and-test.result }}
          TFLINT_RESULT: ${{ needs.tflint.result }}
          CHECKOV_RESULT: ${{ needs.security.result }}
        run: |
          set -euo pipefail

          icon() {
            case "$1" in
              success) printf '✅' ;;
              failure) printf '❌' ;;
              cancelled) printf '⏹️' ;;
              skipped) printf '⏭️' ;;
              *) printf '⚠️' ;;
            esac
          }

          test_line() {
            local log="artifacts/tf-test-$1.log"
            local summary=""
            if [[ -f "$log" ]]; then
              summary="$(grep -Eo 'Success! [0-9]+ passed, [0-9]+ failed|Failure! [0-9]+ passed, [0-9]+ failed, [0-9]+ skipped' "$log" | tail -1 || true)"
            fi
            if [[ -n "$summary" ]]; then
              printf '%s' "$summary"
            else
              printf 'log unavailable'
            fi
          }

          test_state() {
            local log="artifacts/tf-test-$1.log"
            if [[ -f "$log" ]]; then
              if grep -q '^Failure!' "$log"; then
                printf 'failure'
                return
              fi
              if grep -q '^Success!' "$log"; then
                printf 'success'
                return
              fi
            fi
            printf 'unknown'
          }

          TEST_198="$(test_line 1.9.8)"
          TEST_115="$(test_line 1.15.6)"
          TEST_198_STATE="$(test_state 1.9.8)"
          TEST_115_STATE="$(test_state 1.15.6)"

          PLAN_SUMMARY="$(grep -Eo 'Plan: [0-9]+ to add, [0-9]+ to change, [0-9]+ to destroy' plan-artifacts/plan.txt 2>/dev/null | tail -1 || true)"
          if [[ -z "$PLAN_SUMMARY" ]]; then
            PLAN_SUMMARY='plan unavailable'
          fi

          PLAN_DIFF='no previous plan'
          if [[ -f plan-artifacts/plan-diff-stat.txt ]]; then
            PLAN_DIFF="$(tr -d '\n' < plan-artifacts/plan-diff-stat.txt)"
          fi

          VERSION_VALUE="$(tr -d '[:space:]' < VERSION)"

          if [[ "$FMT_RESULT" == "success" && "$VERSION_RESULT" == "success" && "$PLAN_RESULT" == "success" && "$TEST_RESULT" == "success" && "$TFLINT_RESULT" == "success" && "$CHECKOV_RESULT" == "success" ]]; then
            OVERALL="$(printf '### ✅ All Terraform gates passed\n\nThe change is ready for review. CI produced an offline plan only; apply stays manual.')"
          else
            OVERALL="$(printf '### ❌ Verification failed\n\nAt least one gate failed. Open the failing job below for details.')"
          fi

          {
            echo "## Terraform verification report"
            echo
            echo "$OVERALL"
            echo
            echo "| Gate | Result | Details |"
            echo "|:--|:--:|:--|"
            echo "| Format | $(icon "$FMT_RESULT") ${FMT_RESULT} | \`terraform fmt -check\` |"
            echo "| Version | $(icon "$VERSION_RESULT") ${VERSION_RESULT} | \`${VERSION_VALUE}\` · CHANGELOG entry present |"
            echo "| Terraform plan | $(icon "$PLAN_RESULT") ${PLAN_RESULT} | ${PLAN_SUMMARY} |"
            echo "| Plan diff | $(icon "$PLAN_RESULT") ${PLAN_RESULT} | ${PLAN_DIFF} |"
            echo "| Tests on Terraform 1.9.8 | $(icon "$TEST_198_STATE") ${TEST_198_STATE} | ${TEST_198} |"
            echo "| Tests on Terraform 1.15.6 | $(icon "$TEST_115_STATE") ${TEST_115_STATE} | ${TEST_115} |"
            echo "| TFLint | $(icon "$TFLINT_RESULT") ${TFLINT_RESULT} | Google ruleset 0.40.0 |"
            echo "| Checkov | $(icon "$CHECKOV_RESULT") ${CHECKOV_RESULT} | Exceptions in \`.checkov.yaml\` |"
            echo
            echo "**Commit:** \`${GITHUB_SHA::7}\` · **Ref:** \`${GITHUB_REF_NAME}\` · **Event:** \`${GITHUB_EVENT_NAME}\` · **Actor:** @${GITHUB_ACTOR}"
            echo
            echo "[Open workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo
            echo "_CI checks formatting, schema, mocked tests, linting, security and an offline plan. Apply stays manual._"
          } >> "$GITHUB_STEP_SUMMARY"

          cat "$GITHUB_STEP_SUMMARY"
